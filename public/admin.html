<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VelorianTech — Administração</title>
<style>
:root{--bg:#0f1117;--panel:#181b25;--card:#202431;--border:#303647;--text:#f5f7ff;--muted:#9aa3b8;--primary:#7c5cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{background:#151824;border-bottom:1px solid var(--border);padding:20px}.top{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:24px;margin:0}.logo{color:#a999ff}.subtitle{color:var(--muted);margin-top:6px;font-size:14px}
button{border:0;border-radius:9px;padding:11px 16px;background:var(--primary);color:#fff;cursor:pointer;font-weight:bold}.secondary{background:#303647}
main{max-width:1200px;margin:30px auto;padding:0 18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:25px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px}.stat span{color:var(--muted);font-size:13px}.stat strong{display:block;font-size:28px;margin-top:8px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.orders{display:grid;gap:14px}
.order{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:20px}.order-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;border-bottom:1px solid var(--border);padding-bottom:15px;margin-bottom:15px}
.order-id{font-weight:bold;color:#b8adff}.date{color:var(--muted);font-size:13px;margin-top:5px}.status{border:1px solid var(--border);background:var(--card);color:#fff;padding:9px;border-radius:8px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:20px}.info h3{font-size:14px;margin:0 0 8px;color:#b8adff}.info p{margin:5px 0;color:#d8dce7}
.items{background:var(--card);padding:12px;border-radius:9px;margin-top:14px}.item{display:flex;justify-content:space-between;gap:15px;padding:7px 0;border-bottom:1px solid var(--border)}.item:last-child{border:0}.total{font-size:20px;font-weight:bold;margin-top:14px;text-align:right;color:#8df0be}
.empty{text-align:center;color:var(--muted);padding:50px;background:var(--panel);border-radius:12px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.info{grid-template-columns:1fr}.top,.toolbar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><div class="top"><div><h1>Velorian<span class="logo">Tech</span> — Administração</h1><div class="subtitle">Gerenciamento de pedidos</div></div><div><button class="secondary" onclick="logout()">Sair</button> <button onclick="loadOrders()">↻ Atualizar</button></div></div></header>
<main>
<div class="stats"><div class="stat"><span>Total</span><strong id="totalOrders">0</strong></div><div class="stat"><span>Novos</span><strong id="newOrders">0</strong></div><div class="stat"><span>Em preparação</span><strong id="preparingOrders">0</strong></div><div class="stat"><span>Concluídos</span><strong id="completedOrders">0</strong></div></div>
<div class="toolbar"><h2 style="margin:0">Pedidos recebidos</h2><span id="lastUpdate" style="color:#9aa3b8;font-size:13px"></span></div>
<div id="orders" class="orders"><div class="empty">Carregando...</div></div>
</main>
<script>
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function verify(){const r=await fetch('/api/admin/check');const d=await r.json();if(!d.authenticated)location.href='/admin-login.html';}
async function loadOrders(){try{const r=await fetch('/api/orders');if(r.status===401){location.href='/admin-login.html';return}const orders=await r.json();
totalOrders.textContent=orders.length;newOrders.textContent=orders.filter(o=>o.status==='Novo').length;preparingOrders.textContent=orders.filter(o=>o.status==='Em preparação').length;completedOrders.textContent=orders.filter(o=>o.status==='Concluído').length;lastUpdate.textContent='Atualizado: '+new Date().toLocaleTimeString('pt-BR');
if(!orders.length){orders=document.getElementById('orders');orders.innerHTML='<div class="empty">📦 Ainda não existem pedidos.</div>';return}
document.getElementById('orders').innerHTML=orders.map(o=>`<article class="order"><div class="order-head"><div><div class="order-id">${esc(o.id)}</div><div class="date">${o.created_at?new Date(o.created_at).toLocaleString('pt-BR'):''}</div></div><select class="status" onchange="updateStatus('${esc(o.id)}',this.value)">${['Novo','Em preparação','Enviado','Concluído','Cancelado'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="info"><div><h3>CLIENTE</h3><p><strong>${esc(o.customer?.name)}</strong></p><p>📱 ${esc(o.customer?.phone)}</p><p>📍 ${esc(o.customer?.address)}</p></div><div><h3>PAGAMENTO</h3><p>${esc(o.payment||'Não informado')}</p></div></div><div class="items">${(o.items||[]).map(i=>`<div class="item"><span>${esc(i.title)} × ${i.quantity}</span><strong>${money(i.subtotal??i.unit_price*i.quantity)}</strong></div>`).join('')}</div><div class="total">Total: ${money(o.total)}</div></article>`).join('');
}catch(e){document.getElementById('orders').innerHTML='<div class="empty">❌ Erro ao carregar pedidos.</div>'}}
async function updateStatus(id,status){const r=await fetch('/api/orders/'+encodeURIComponent(id)+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});if(!r.ok)alert('Erro ao atualizar.');loadOrders()}
async function logout(){await fetch('/api/admin/logout',{method:'POST'});location.href='/admin-login.html'}
verify().then(loadOrders);setInterval(loadOrders,30000);
</script>
</body></html>
