<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VelorianTech — Administração</title>

<style>
:root{
  --bg:#0f1117;
  --panel:#181b25;
  --card:#202431;
  --border:#303647;
  --text:#f5f7ff;
  --muted:#9aa3b8;
  --primary:#7c5cff;
  --success:#8df0be;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

header{
  background:#151824;
  border-bottom:1px solid var(--border);
  padding:20px;
}

.top{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

h1{
  font-size:24px;
  margin:0;
}

.logo{
  color:#a999ff;
}

.subtitle{
  color:var(--muted);
  margin-top:6px;
  font-size:14px;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  background:var(--primary);
  color:#fff;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  opacity:.9;
}

.secondary{
  background:#303647;
}

main{
  max-width:1200px;
  margin:30px auto;
  padding:0 18px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px;
}

.stat span{
  color:var(--muted);
  font-size:13px;
}

.stat strong{
  display:block;
  font-size:28px;
  margin-top:8px;
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:15px;
}

.orders{
  display:grid;
  gap:14px;
}

.order{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  padding:20px;
}

.order-head{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-start;
  border-bottom:1px solid var(--border);
  padding-bottom:15px;
  margin-bottom:15px;
}

.order-id{
  font-weight:bold;
  color:#b8adff;
  font-size:16px;
}

.date{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.status{
  border:1px solid var(--border);
  background:var(--card);
  color:#fff;
  padding:9px;
  border-radius:8px;
  cursor:pointer;
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.info h3{
  font-size:14px;
  margin:0 0 8px;
  color:#b8adff;
}

.info p{
  margin:5px 0;
  color:#d8dce7;
}

.items{
  background:var(--card);
  padding:12px;
  border-radius:9px;
  margin-top:14px;
}

.item{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:8px 0;
  border-bottom:1px solid var(--border);
}

.item:last-child{
  border:0;
}

.item-name{
  flex:1;
}

.item-quantity{
  color:var(--muted);
}

.total{
  font-size:20px;
  font-weight:bold;
  margin-top:14px;
  text-align:right;
  color:var(--success);
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:50px;
  background:var(--panel);
  border-radius:12px;
  border:1px solid var(--border);
}

.error{
  text-align:center;
  color:#ff8f8f;
  padding:30px;
  background:var(--panel);
  border-radius:12px;
  border:1px solid #5a3030;
}

.loading{
  text-align:center;
  color:var(--muted);
  padding:50px;
}

@media(max-width:700px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .info{
    grid-template-columns:1fr;
  }

  .top,
  .toolbar{
    align-items:flex-start;
    flex-direction:column;
  }

  .order-head{
    flex-direction:column;
  }

  .status{
    width:100%;
  }
}
</style>

</head>

<body>

<header>
  <div class="top">

```
<div>
  <h1>
    Velorian<span class="logo">Tech</span> — Administração
  </h1>

  <div class="subtitle">
    Gerenciamento de pedidos
  </div>
</div>

<div>
  <button class="secondary" onclick="logout()">
    Sair
  </button>

  <button onclick="loadOrders()">
    ↻ Atualizar
  </button>
</div>
```

  </div>
</header>

<main>

  <div class="stats">

```
<div class="stat">
  <span>Total</span>
  <strong id="totalOrders">0</strong>
</div>

<div class="stat">
  <span>Novos</span>
  <strong id="newOrders">0</strong>
</div>

<div class="stat">
  <span>Em preparação</span>
  <strong id="preparingOrders">0</strong>
</div>

<div class="stat">
  <span>Concluídos</span>
  <strong id="completedOrders">0</strong>
</div>
```

  </div>

  <div class="toolbar">

```
<h2 style="margin:0">
  Pedidos recebidos
</h2>

<span
  id="lastUpdate"
  style="color:#9aa3b8;font-size:13px">
</span>
```

  </div>

  <div id="orders" class="orders">

```
<div class="loading">
  Carregando pedidos...
</div>
```

  </div>

</main>

<script>

const money = value =>
  Number(value || 0).toLocaleString(
    'pt-BR',
    {
      style:'currency',
      currency:'BRL'
    }
  );


const esc = value =>
  String(value ?? '')
    .replace(
      /[&<>"']/g,
      character => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'
      })[character]
    );


/* =========================================
   VERIFICAR LOGIN
========================================= */

async function verify(){

  try{

    const response =
      await fetch('/api/admin/me');

    if(!response.ok){

      window.location.href =
        '/admin-login.html';

      return false;
    }

    const data =
      await response.json();

    if(!data.authenticated){

      window.location.href =
        '/admin-login.html';

      return false;
    }

    return true;

  }catch(error){

    console.error(
      'Erro ao verificar autenticação:',
      error
    );

    window.location.href =
      '/admin-login.html';

    return false;
  }
}


/* =========================================
   CARREGAR PEDIDOS
========================================= */

async function loadOrders(){

  const container =
    document.getElementById('orders');

  try{

    const response =
      await fetch('/api/orders', {
        credentials:'same-origin'
      });

    if(response.status === 401){

      window.location.href =
        '/admin-login.html';

      return;
    }

    if(!response.ok){

      throw new Error(
        'Erro HTTP ' + response.status
      );
    }

    const orders =
      await response.json();


    /* ESTATÍSTICAS */

    document.getElementById(
      'totalOrders'
    ).textContent =
      orders.length;


    document.getElementById(
      'newOrders'
    ).textContent =
      orders.filter(
        order => order.status === 'Novo'
      ).length;


    document.getElementById(
      'preparingOrders'
    ).textContent =
      orders.filter(
        order => order.status === 'Em preparação'
      ).length;


    document.getElementById(
      'completedOrders'
    ).textContent =
      orders.filter(
        order => order.status === 'Concluído'
      ).length;


    document.getElementById(
      'lastUpdate'
    ).textContent =
      'Atualizado: ' +
      new Date().toLocaleTimeString('pt-BR');


    /* SEM PEDIDOS */

    if(!orders.length){

      container.innerHTML = `
        <div class="empty">
          📦 Ainda não existem pedidos.
        </div>
      `;

      return;
    }


    /* RENDERIZAR PEDIDOS */

    container.innerHTML =
      orders.map(order => {

        const items =
          Array.isArray(order.items)
            ? order.items
            : [];


        const itemHTML =
          items.map(item => {

            const subtotal =
              item.subtotal ??
              (
                Number(item.unit_price || 0) *
                Number(item.quantity || 0)
              );


            return `
              <div class="item">

                <span class="item-name">
                  ${esc(item.title)}
                </span>

                <span class="item-quantity">
                  × ${esc(item.quantity)}
                </span>

                <strong>
                  ${money(subtotal)}
                </strong>

              </div>
            `;

          }).join('');


        const statuses = [
          'Novo',
          'Em preparação',
          'Enviado',
          'Concluído',
          'Cancelado'
        ];


        const statusOptions =
          statuses.map(status => `
            <option
              value="${esc(status)}"
              ${order.status === status ? 'selected' : ''}>
              ${esc(status)}
            </option>
          `).join('');


        const createdDate =
          order.created_at
            ? new Date(
                order.created_at
              ).toLocaleString('pt-BR')
            : 'Data não informada';


        return `

          <article class="order">

            <div class="order-head">

              <div>

                <div class="order-id">
                  Pedido ${esc(order.id)}
                </div>

                <div class="date">
                  ${createdDate}
                </div>

              </div>


              <select
                class="status"
                onchange="updateStatus(
                  '${esc(order.id)}',
                  this.value
                )">

                ${statusOptions}

              </select>

            </div>


            <div class="info">

              <div>

                <h3>CLIENTE</h3>

                <p>
                  <strong>
                    ${esc(order.customer?.name)}
                  </strong>
                </p>

                <p>
                  📱 ${esc(order.customer?.phone)}
                </p>

                <p>
                  📍 ${esc(order.customer?.address)}
                </p>

              </div>


              <div>

                <h3>PAGAMENTO</h3>

                <p>
                  ${esc(
                    order.payment ||
                    'Não informado'
                  )}
                </p>

                ${
                  order.updated_at
                    ? `
                      <p style="color:#9aa3b8;font-size:12px">
                        Última alteração:
                        ${new Date(
                          order.updated_at
                        ).toLocaleString('pt-BR')}
                      </p>
                    `
                    : ''
                }

              </div>

            </div>


            <div class="items">

              ${itemHTML || `
                <div class="item">
                  Nenhum produto informado.
                </div>
              `}

            </div>


            <div class="total">
              Total: ${money(order.total)}
            </div>

          </article>

        `;

      }).join('');


  }catch(error){

    console.error(
      'Erro ao carregar pedidos:',
      error
    );

    container.innerHTML = `
      <div class="error">
        ❌ Erro ao carregar os pedidos.
        <br><br>
        Verifique sua conexão e tente novamente.
      </div>
    `;

  }

}


/* =========================================
   ALTERAR STATUS
========================================= */

async function updateStatus(id, status){

  try{

    const response =
      await fetch(
        '/api/orders/' +
        encodeURIComponent(id) +
        '/status',
        {
          method:'PATCH',

          credentials:'same-origin',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:JSON.stringify({
            status
          })
        }
      );


    if(response.status === 401){

      window.location.href =
        '/admin-login.html';

      return;
    }


    if(!response.ok){

      const data =
        await response.json()
          .catch(() => ({}));

      throw new Error(
        data.error ||
        'Não foi possível atualizar o pedido.'
      );
    }


    await loadOrders();


  }catch(error){

    console.error(
      'Erro ao atualizar status:',
      error
    );

    alert(
      error.message ||
      'Erro ao atualizar o status.'
    );

    await loadOrders();
  }

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

  try{

    await fetch(
      '/api/admin/logout',
      {
        method:'POST',
        credentials:'same-origin'
      }
    );

  }catch(error){

    console.error(
      'Erro ao sair:',
      error
    );

  }

  window.location.href =
    '/admin-login.html';
}


/* =========================================
   INICIALIZAÇÃO
========================================= */

(async function(){

  const authenticated =
    await verify();

  if(authenticated){

    await loadOrders();

    setInterval(
      loadOrders,
      30000
    );

  }

})();

</script>

</body>
</html>
