<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VelorianTech — Login Administrativo</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1117;color:#fff;font-family:Arial,sans-serif}
.box{width:min(400px,calc(100% - 40px));background:#181b25;border:1px solid #303647;border-radius:16px;padding:30px;box-sizing:border-box}
h1{margin:0 0 8px}.logo{color:#a999ff}.sub{color:#9aa3b8;margin-bottom:25px}
label{display:block;margin:15px 0 7px;color:#d8dce7}
input{width:100%;box-sizing:border-box;padding:13px;border-radius:9px;border:1px solid #3a4155;background:#202431;color:white;font-size:16px}
button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:9px;background:#7c5cff;color:white;font-weight:bold;font-size:16px;cursor:pointer}
#msg{min-height:22px;margin-top:16px;text-align:center;color:#ff8c8c}
</style>
</head>
<body>
<div class="box">
<h1>Velorian<span class="logo">Tech</span></h1>
<div class="sub">Login do administrador</div>
<form id="form">
<label>Usuário</label>
<input id="username" autocomplete="username" required>
<label>Senha</label>
<input id="password" type="password" autocomplete="current-password" required>
<button id="btn">Entrar no painel</button>
<div id="msg"></div>
</form>
</div>
<script>
fetch('/api/admin/check').then(r=>r.json()).then(d=>{
 if(d.authenticated) location.href='/admin.html';
});
document.getElementById('form').addEventListener('submit',async e=>{
 e.preventDefault();
 const btn=document.getElementById('btn'),msg=document.getElementById('msg');
 btn.disabled=true; btn.textContent='Entrando...'; msg.textContent='';
 try{
  const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({username:username.value,password:password.value})});
  const d=await r.json();
  if(!r.ok) throw new Error(d.error||'Não foi possível entrar.');
  location.href='/admin.html';
 }catch(err){msg.textContent=err.message;btn.disabled=false;btn.textContent='Entrar no painel';}
});
</script>
</body>
</html>
